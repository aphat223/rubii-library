<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff4f0"><title>Rubii Library ♡</title><style>
:root{--bg:#fff5f0;--panel:#fffdfb;--panel2:#fff0eb;--ink:#795b59;--muted:#ae8d87;--line:#f1ded7;--pink:#f5d7e3;--peach:#f5c9aa;--accent:#c8899b;--accent2:#b98270;--shadow:0 8px 24px #b98b7b18;--field:#fff7f4} [data-theme=dark]{--bg:#211d23;--panel:#2d2630;--panel2:#392d38;--ink:#f0dce3;--muted:#b99eaa;--line:#4b3b49;--pink:#503847;--peach:#574237;--accent:#e3a9c0;--accent2:#e5b091;--shadow:0 8px 24px #0003;--field:#342b35}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:780px;margin:auto;padding:17px 14px 80px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{font-size:26px;font-weight:850;letter-spacing:-1px;color:var(--accent2)}.sub,.tiny{font-size:11px;color:var(--muted)}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0}.btn,.iconbtn{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:13px;padding:10px 12px}.hero{background:linear-gradient(120deg,var(--pink),var(--peach));border-radius:21px;padding:17px;margin:16px 0;color:#805d61}.hero h1{font-size:20px;margin:0 0 5px}.hero p{font-size:12px;margin:0}.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0}.search{flex:1;min-width:160px;background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:11px}.search input{width:100%;border:0;outline:0;background:transparent;color:var(--ink)}.tabs{display:flex;gap:7px;overflow:auto;padding:3px 0 8px}.tab,.pill{white-space:nowrap;background:var(--panel2);color:var(--accent2);border-radius:99px;padding:9px 12px;font-size:11px}.tab.active{background:var(--accent);color:white}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.cat{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:13px;text-align:left;color:var(--ink);min-height:112px;box-shadow:var(--shadow)}.cat .emoji{font-size:24px;display:block;margin-bottom:8px}.cat b{font-size:11px;display:block}.cat small{display:block;color:var(--muted);font-size:10px;margin-top:4px}.section{display:flex;justify-content:space-between;align-items:center;margin:18px 2px 10px}.section h2{font-size:14px;margin:0}.snippet{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px;margin:9px 0}.sniphead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:7px}.sniphead b{font-size:11px}.rowcopy{display:flex;align-items:center;gap:7px;min-width:0}.previewtext{min-width:0;flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;background:var(--field);border:1px solid var(--line);border-radius:9px;padding:10px;font:11px ui-monospace,monospace;color:var(--ink)}.copy{width:38px;height:38px;flex:0 0 38px;border-radius:10px;background:var(--pink);color:var(--accent2)}.mini{background:var(--panel2);color:var(--accent2);border-radius:9px;padding:6px 8px;font-size:10px}.primary{background:var(--accent);color:white;border-radius:12px;padding:11px 14px;font-weight:700;font-size:12px}.secondary{background:var(--panel2);color:var(--accent2);border:1px solid var(--line);border-radius:12px;padding:10px 13px;font-size:12px}.empty{text-align:center;padding:25px;color:var(--muted);font-size:13px}.hidden{display:none!important}.modal{position:fixed;inset:0;background:#241b22a8;display:none;align-items:flex-end;justify-content:center;padding:10px;z-index:10}.modal.show{display:flex}.sheet{width:min(100%,590px);max-height:92vh;overflow:auto;background:var(--panel);border-radius:21px;padding:17px}.sheet h3{margin:0 0 12px}.field{display:block;margin:10px 0}.field span{display:block;font-size:11px;color:var(--muted);margin-bottom:5px}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);background:var(--field);color:var(--ink);border-radius:10px;padding:11px;font-size:13px}.field textarea{min-height:110px;font-family:ui-monospace,monospace}.modalactions{display:flex;gap:8px;margin-top:13px}.modalactions>*{flex:1}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#795b59;color:white;padding:10px 15px;border-radius:30px;font-size:12px;opacity:0;pointer-events:none}.toast.show{opacity:1}.tag{font-size:10px;color:var(--muted);padding:4px 7px;background:var(--panel2);border-radius:20px}.preview{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:13px;margin-top:15px}.mock{background:linear-gradient(120deg,#fff0f3,#f8d5c2);color:#805d61;border-radius:13px;padding:14px}.mock strong{font-size:27px;display:block}.foot{text-align:center;color:var(--muted);font-size:10px;margin:25px 0}.authhint{font-size:11px;color:var(--muted);line-height:1.5}@media(min-width:620px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.modal{align-items:center}}
</style></head><body><main class="app"><header class="top"><div><div class="brand">Rubii Library ♡</div><div class="sub">MY LITTLE CODE COLLECTION 🍑</div></div><div style="display:flex;gap:6px"><button class="iconbtn" id="theme">🌙</button><button class="btn" id="authBtn">เข้าสู่ระบบ</button></div></header><section class="hero"><h1>เก็บโค้ดให้เป็นระเบียบ ✿</h1><p>คลังโค้ด Rubii ของทุกคน · มีพื้นที่ส่วนตัวสำหรับสมาชิก</p></section><div class="bar"><div class="search">⌕ <input id="search" placeholder="ค้นหาหมวดหมู่หรือโค้ด..."></div><button class="primary" id="add">＋ เพิ่มโค้ด</button></div><nav class="tabs"><button class="tab active" data-view="public">คลังกลาง</button><button class="tab" data-view="mine">คลังของฉัน</button></nav><div class="section"><h2 id="heading">♡ PUBLIC LIBRARY</h2><span class="tiny" id="count"></span></div><div id="cats" class="grid"></div><div id="detail" class="hidden"><div class="section"><button class="secondary" id="back">← กลับไปหมวดหมู่</button><span class="tiny" id="catname"></span></div><div id="snippets"></div><div class="preview"><b style="font-size:12px">♡ LIVE PREVIEW</b><div class="mock"><span style="font-size:10px">WEDNESDAY · UNIVERSITY</span><strong>09:30</strong><span style="font-size:11px">✿ MAIN HALL · STATUS ONLINE</span></div></div></div><div class="foot">made with love ♡ for rubii creators</div></main>
<div class="modal" id="modal"><div class="sheet"><h3 id="mtitle">เข้าสู่ระบบ</h3><div id="fields"></div><div class="modalactions" id="macts"></div><p class="authhint" id="hint"></p></div></div><div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./supabase-config.js"></script><script>
const configured=window.RUBII_SUPABASE_URL&&window.RUBII_SUPABASE_ANON_KEY&&!window.RUBII_SUPABASE_URL.includes('PASTE_')&&!window.RUBII_SUPABASE_ANON_KEY.includes('PASTE_');
const db=configured?window.supabase.createClient(window.RUBII_SUPABASE_URL,window.RUBII_SUPABASE_ANON_KEY):null;
let user=null,view='public',categories=[],items=[],current=null,editId=null,authMode='login';
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(s){$('toast').textContent=s;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1800)}
async function copy(s){try{await navigator.clipboard.writeText(s);toast('คัดลอกแล้ว ♡')}catch(e){let t=document.createElement('textarea');t.value=s;document.body.append(t);t.select();document.execCommand('copy');t.remove();toast('คัดลอกแล้ว ♡')}}
function modal(title,fields,actions,hint=''){$('mtitle').textContent=title;$('fields').innerHTML=fields;$('macts').innerHTML=actions;$('hint').textContent=hint;$('modal').classList.add('show')}
function closeModal(){$('modal').classList.remove('show')}
function authDialog(mode='login'){authMode=mode;modal(mode==='login'?'เข้าสู่ระบบ ♡':'สมัครสมาชิก ♡',`<label class="field"><span>อีเมล</span><input id="email" type="email" autocomplete="email" placeholder="you@email.com"></label><label class="field"><span>รหัสผ่าน</span><input id="password" type="password" autocomplete="${mode==='login'?'current-password':'new-password'}" placeholder="อย่างน้อย 6 ตัวอักษร"></label>`, `<button class="secondary" id="cancel">ยกเลิก</button><button class="primary" id="submitAuth">${mode==='login'?'เข้าสู่ระบบ':'สร้างบัญชี'}</button><button class="secondary" id="google">เข้าสู่ระบบด้วย Google</button><button class="mini" id="switchAuth">${mode==='login'?'ยังไม่มีบัญชี? สมัครสมาชิก':'มีบัญชีแล้ว? เข้าสู่ระบบ'}</button>`, 'สมัครด้วยอีเมลอาจต้องกดยืนยันจากอีเมลก่อนใช้งาน');$('cancel').onclick=closeModal;$('switchAuth').onclick=()=>authDialog(mode==='login'?'signup':'login');$('google').onclick=googleLogin;$('submitAuth').onclick=submitAuth}
async function submitAuth(){if(!db)return;let email=$('email').value.trim(),password=$('password').value;if(!email||!password)return toast('กรอกอีเมลและรหัสผ่านก่อน');let r=authMode==='signup'?await db.auth.signUp({email,password}):await db.auth.signInWithPassword({email,password});if(r.error)return toast(r.error.message);closeModal();toast(authMode==='signup'?'สมัครแล้ว กรุณาตรวจอีเมลยืนยัน':'เข้าสู่ระบบแล้ว');await refresh()}
async function googleLogin(){if(!db)return;let {error}=await db.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin}});if(error)toast(error.message)}
async function logout(){await db.auth.signOut();await refresh();toast('ออกจากระบบแล้ว')}
async function refresh(){if(!db){$('heading').textContent='ตั้งค่าฐานข้อมูลก่อนใช้งาน';$('cats').innerHTML='<div class="empty">ยังไม่ได้เชื่อม Supabase · เปิดไฟล์ README_SETUP_TH.txt เพื่อทำตามขั้นตอน</div>';return}let s=await db.auth.getSession();user=s.data.session?.user||null;$('authBtn').textContent=user?(user.email?.split('@')[0]+' · ออกจากระบบ'):'เข้าสู่ระบบ';$('authBtn').onclick=()=>user?logout():authDialog();let c=await db.from('categories').select('*').order('name');if(c.error){toast(c.error.message);return}categories=c.data||[];await loadItems()}
async function loadItems(){let q=db.from('snippets').select('id,category_id,owner_id,title,content,visibility,status,created_at').order('created_at',{ascending:false});if(view==='public')q=q.eq('visibility','public').eq('status','published');else if(user)q=q.eq('owner_id',user.id);else q=null;let r=q?await q: {data:[],error:null};if(r.error)toast(r.error.message);items=r.data||[];render()}
function render(){let query=$('search').value.toLowerCase();$('heading').textContent=view==='public'?'♡ PUBLIC LIBRARY':'♡ MY PRIVATE LIBRARY';$('count').textContent=items.length+' CODE ITEMS';$('cats').classList.toggle('hidden',!!current);$('detail').classList.toggle('hidden',!current);if(!current){let list=categories.filter(c=>(c.name+' '+c.description).toLowerCase().includes(query));$('cats').innerHTML=list.map(c=>`<button class="cat" data-cat="${esc(c.id)}"><span class="emoji">${esc(c.emoji)}</span><b>${esc(c.name)}</b><small>${esc(c.description)}</small><small style="margin-top:9px">${items.filter(x=>x.category_id===c.id).length} ITEMS ›</small></button>`).join('')||'<div class="empty">ไม่พบหมวดหมู่ ♡</div>';document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{current=b.dataset.cat;render()})}else{let cat=categories.find(c=>c.id===current);$('catname').textContent=cat?.name||'';let rows=items.filter(x=>x.category_id===current&&(x.title+' '+x.content).toLowerCase().includes(query));$('snippets').innerHTML=rows.map(x=>`<article class="snippet"><div class="sniphead"><b>${esc(x.title)}</b><span class="tag">${x.visibility==='private'?'PRIVATE':'PUBLIC'}</span></div><div class="rowcopy"><div class="previewtext" title="${esc(x.content)}">${esc(x.content||'ยังไม่มีข้อความ')}</div><button class="copy" data-copy="${x.id}">▢</button><button class="mini" data-edit="${x.id}">แก้ไข</button></div></article>`).join('')||'<div class="empty">ยังไม่มีโค้ดในหมวดนี้ ♡</div>';document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>copy(items.find(x=>x.id===b.dataset.copy).content));document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editSnippet(b.dataset.edit))}}
function addSnippet(){if(!user)return authDialog();editId=null;let opts=categories.map(c=>`<option value="${esc(c.id)}" ${c.id===current?'selected':''}>${esc(c.name)}</option>`).join('');modal('เพิ่มโค้ดใหม่ ♡',`<label class="field"><span>หมวดหมู่</span><select id="category">${opts}</select></label><label class="field"><span>ชื่อรายการ เช่น CSS CODE / REGEX</span><input id="title" placeholder="CSS CODE"></label><label class="field"><span>โค้ด / ข้อความ</span><textarea id="content" placeholder="วางโค้ดของคุณที่นี่"></textarea></label><label class="field"><span>จัดเก็บแบบ</span><select id="visibility"><option value="public">เผยแพร่ในคลังกลาง</option><option value="private">เก็บไว้ในคลังส่วนตัว</option></select></label>`,`<button class="secondary" id="cancel">ยกเลิก</button><button class="primary" id="save">บันทึกโค้ด</button>`,'โค้ดสาธารณะจะปรากฏให้ทุกคนเห็นและคัดลอกได้');$('cancel').onclick=closeModal;$('save').onclick=saveSnippet}
function editSnippet(id){let x=items.find(a=>a.id===id);if(!x||x.owner_id!==user?.id)return toast('แก้ไขได้เฉพาะโค้ดของคุณ');editId=id;let opts=categories.map(c=>`<option value="${esc(c.id)}" ${c.id===x.category_id?'selected':''}>${esc(c.name)}</option>`).join('');modal('แก้ไขโค้ด ♡',`<label class="field"><span>หมวดหมู่</span><select id="category">${opts}</select></label><label class="field"><span>ชื่อรายการ</span><input id="title" value="${esc(x.title)}"></label><label class="field"><span>โค้ด / ข้อความ</span><textarea id="content">${esc(x.content)}</textarea></label><label class="field"><span>การมองเห็น</span><select id="visibility"><option value="public" ${x.visibility==='public'?'selected':''}>คลังกลาง</option><option value="private" ${x.visibility==='private'?'selected':''}>ส่วนตัว</option></select></label>`,`<button class="secondary" id="cancel">ยกเลิก</button><button class="secondary" id="remove">ลบ</button><button class="primary" id="save">บันทึก</button>`);$('cancel').onclick=closeModal;$('save').onclick=saveSnippet;$('remove').onclick=deleteSnippet}
async function saveSnippet(){let payload={category_id:$('category').value,title:$('title').value.trim(),content:$('content').value,visibility:$('visibility').value,status:'published'};if(!payload.title||!payload.content)return toast('กรอกชื่อและเนื้อหาก่อน');let r=editId?await db.from('snippets').update(payload).eq('id',editId):await db.from('snippets').insert({...payload,owner_id:user.id});if(r.error)return toast(r.error.message);closeModal();current=payload.category_id;await loadItems();toast('บันทึกแล้ว ♡')}
async function deleteSnippet(){if(!confirm('ลบโค้ดรายการนี้ใช่ไหม?'))return;let r=await db.from('snippets').delete().eq('id',editId);if(r.error)return toast(r.error.message);closeModal();await loadItems();toast('ลบแล้ว')}
$('add').onclick=addSnippet;$('back').onclick=()=>{current=null;render()};$('search').oninput=render;$('tabs').onclick=e=>{};document.querySelectorAll('.tab').forEach(b=>b.onclick=async()=>{view=b.dataset.view;current=null;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));if(view==='mine'&&!user){authDialog();view='public';document.querySelector('[data-view="public"]').classList.add('active');document.querySelector('[data-view="mine"]').classList.remove('active');return}await loadItems()});$('theme').onclick=()=>{let t=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=t;localStorage.setItem('rubiiTheme',t);$('theme').textContent=t==='dark'?'☀️':'🌙'};document.documentElement.dataset.theme=localStorage.getItem('rubiiTheme')||'light';$('theme').textContent=document.documentElement.dataset.theme==='dark'?'☀️':'🌙';$('modal').onclick=e=>{if(e.target.id==='modal')closeModal()};
(async()=>{if(!configured){refresh();return}db.auth.onAuthStateChange(()=>setTimeout(refresh,0));await refresh()})();
</script></body></html>
